ru:
  site_settings:
    wb_staged_claim_guard_enabled: "Не давать сделать обычной теневую учётку служебного адреса компании — регистрацией, приглашением или входом. Без этого любой, кто зарегистрируется с адресом info@, сразу занимает его теневую учётку, и портал перестаёт принимать почту с этого адреса."
    wb_staged_claim_guard_protected: "Защищённые домены (весь домен) и точные адреса (запись с @). Защищаются только уже существующие теневые учётки с этими адресами: новые регистрации на этих доменах и теневые учётки клиентов не затрагиваются."
  wb_staged_claim_guard:
    signup_refused: "Это служебный адрес компании, зарегистрироваться с ним нельзя. Если вам нужна учётная запись с этим адресом, напишите администраторам форума."
    unstage_refused: "Теневая учётка служебного адреса компании защищена: её нельзя занять регистрацией, приглашением или входом. Если это нужно сделать осознанно, уберите адрес из настройки wb_staged_claim_guard_protected."
